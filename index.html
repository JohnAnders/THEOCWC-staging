<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17130e">
<title>THEO — Civil War Curator</title>
<style>
:root{--ink:#201b15;--paper:#f3eee3;--card:#fbf8f1;--muted:#756c5f;--line:#d8cfbf;--black:#17130e;--gold:#a07a30;--green:#2f6344;--amber:#8b641f;--red:#8a332e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{color:inherit}.shell{max-width:920px;margin:auto;min-height:100vh;padding:calc(22px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}
.brand{text-align:center;margin:2px 0 26px}.brand-name{font:700 34px/1 Georgia,serif;letter-spacing:.08em}.brand-sub{font-size:11px;letter-spacing:.2em;margin-top:7px;font-weight:800}
.view{display:none}.view.active{display:block}.crumbs{display:flex;gap:7px;align-items:center;overflow:auto;white-space:nowrap;font-size:12px;margin:0 0 18px;color:var(--muted)}.crumbs button{border:0;background:none;padding:0;color:inherit}.crumbs .here{color:var(--ink);font-weight:700}.slash{opacity:.45}
.l0{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.l0-tile,.lane{border:1px solid var(--line);background:var(--card);padding:0;min-height:210px;overflow:hidden;position:relative;text-align:left}.l0-art{height:100px;border-bottom:1px solid var(--line);background:#e7dfd0}.l0-art svg{width:100%;height:100%;display:block}.l0-label{height:108px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font:700 20px/1.15 Georgia,serif;letter-spacing:.02em}
.list{border-top:1px solid var(--line)}.list-row{width:100%;display:block;border:0;border-bottom:1px solid var(--line);background:transparent;padding:17px 2px;text-align:left}.list-title{font:700 18px/1.25 Georgia,serif}.list-sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
.find-card{display:grid;grid-template-columns:92px 1fr;gap:15px;padding:16px 0;border-bottom:1px solid var(--line)}.thumb{width:92px;height:112px;border:1px solid var(--line);background:#e7dfd0;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb svg{width:100%;height:100%}.find-title{font:700 18px/1.25 Georgia,serif}.verdict{font-size:11px;font-weight:900;letter-spacing:.09em;margin:7px 0}.BUY{color:var(--green)}.CONSIDER{color:var(--amber)}.PASS{color:var(--red)}.why{font-size:13px;line-height:1.45}.listing{display:inline-block;margin-top:10px;border:1px solid var(--ink);padding:8px 10px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:800}.dead{opacity:.5;pointer-events:none}
.lanes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.lane{min-height:210px;display:flex;align-items:center;justify-content:center;text-align:center;font:700 20px Georgia,serif;padding:20px}
.item{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:24px}.item-photo{aspect-ratio:3/4;border:1px solid var(--line);background:#e7dfd0;display:flex;align-items:center;justify-content:center;overflow:hidden}.item-photo svg{width:100%;height:100%}.item h1{font:700 28px/1.15 Georgia,serif;margin:0 0 12px}.item p{margin:7px 0;font-size:14px}.empty{padding:24px 0;color:var(--muted);font:17px Georgia,serif}
.askdock{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(888px,calc(100% - 24px));display:grid;grid-template-columns:44px 1fr 44px;gap:8px}.askdock button,.askdock input{height:48px;border:1px solid #b9ad9b;background:#fffdf8}.askdock button{font-size:20px}.askdock input{padding:0 13px;font-size:15px}.askdock input::placeholder{color:#8a8175}
.askspace{min-height:52vh}.ask-context{font-size:12px;color:var(--muted);margin-bottom:10px}.sync-pill{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;border:0;background:transparent;font-size:11px;color:var(--muted);z-index:40;padding:6px}.sync-pill.error{color:var(--red)}
.home-mode .sync-pill,.home-mode .askdock{display:none}
.hidden{display:none!important}
@media(max-width:640px){.shell{padding-left:12px;padding-right:12px}.brand{margin-bottom:20px}.brand-name{font-size:31px}.l0{gap:7px}.l0-tile{min-height:154px}.l0-art{height:70px}.l0-label{height:82px;font-size:15px;padding:6px}.lanes{gap:8px}.lane{min-height:150px;font-size:16px}.find-card{grid-template-columns:72px 1fr;gap:12px}.thumb{width:72px;height:92px}.item{grid-template-columns:105px 1fr;gap:16px}.item h1{font-size:22px}}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="home-mode">
<div class="shell">
  <div class="brand"><div class="brand-name">THEO</div><div class="brand-sub">CIVIL WAR CURATOR</div></div>
  <button id="syncPill" class="sync-pill" title="Sync Google master">SYNC</button>

  <section class="view active" id="homeView">
    <div class="l0">
      <button class="l0-tile" data-go="findsView"><div class="l0-art" id="artFinds"></div><div class="l0-label">TODAY'S FINDS</div></button>
      <button class="l0-tile" data-go="hitView"><div class="l0-art" id="artHit"></div><div class="l0-label">YOUR HIT LIST</div></button>
      <button class="l0-tile" data-go="collectionView"><div class="l0-art" id="artCollection"></div><div class="l0-label">YOUR COLLECTION</div></button>
    </div>
  </section>

  <section class="view" id="findsView"><div class="crumbs" data-crumb="finds"></div><div id="findsList"></div></section>
  <section class="view" id="hitView"><div class="crumbs" data-crumb="hit"></div><div id="hitList" class="list"></div></section>

  <section class="view" id="categoryView"><div class="crumbs" data-crumb="category"></div><div id="itemList" class="list"></div></section>

</div>

<div class="askdock">
  <button id="photoBtn" aria-label="Photo">＋</button>
  <input id="askInput" autocomplete="off" placeholder="Ask Theo">
  <button id="sendBtn" aria-label="Send">↑</button>
  <input id="photoInput" class="hidden" type="file" accept="image/*" capture="environment">
</div>

<script>
const KEY='theoCwcSnapshotV07', OLD_KEY='theoCwcSnapshotV06', TOKEN_KEY='theoCwcGoogleTokenV05';
const CLIENT_ID='1040497896533-mvhth6glhp7m1g49oe2kb8383m77p7ge.apps.googleusercontent.com';
const SPREADSHEET_ID='1nwUZ5Gm4Vdf87sgUUDJ7dUcJVnP-T7tBrkI47o5gVLE';
const SCOPE='https://www.googleapis.com/auth/spreadsheets.readonly';
const RANGES=["Inventory!A1:Z1000","'Outstanding Orders'!A1:Z1000","'Target Register'!A1:Z1000","'Alert Register'!A1:Z1000","'Decision History'!A1:Z1000","'Historical Memory'!A1:L500","'Decision Engine'!A1:N300","'Theo Runtime'!A1:J200","'Sightings'!A1:Z1000"];
let data=null, tokenClient=null, syncing=false, currentView='homeView', currentContext=null, selectedTarget=null, selectedCategory=null, selectedItem=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(v=''){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function norm(s){return String(s??'').trim()} function upper(s){return norm(s).toUpperCase()}
function rowsToObjects(values=[]){if(!values.length)return[];const h=values[0].map(norm);return values.slice(1).filter(r=>r.some(v=>norm(v))).map(r=>{const o={};h.forEach((k,i)=>{if(k)o[k]=r[i]??''});return o})}
function acquisitionState(status=''){const s=upper(status);if(s.includes('DELIVERED')||s.includes('OWNED')||s.includes('RECEIVED'))return'OWNED';if(s.includes('RETURN'))return'EXCLUDED';return'PENDING'}
function activeOperational(s){const x=upper(s);return x.startsWith('OPEN')||x.startsWith('WAITING')}
function exactUrl(u=''){try{const x=new URL(norm(u));return /^https?:$/.test(x.protocol)&&!!x.hostname}catch(e){return false}}
function canon(s=''){return norm(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function words(s=''){return canon(s).split(/\s+/).filter(w=>w.length>=5)}
function hasVerifiedLink(a){const v=upper(a.linkVerification),os=upper(a.operationalStatus);return exactUrl(a.url)&&v.includes('VERIFIED')&&(os==='OPEN / VERIFIED'||os==='OPEN / ACTIONABLE')}
function ownedIds(){return new Set((data?.inventory||[]).filter(x=>x.acquisitionState==='OWNED').map(x=>x.id).filter(Boolean))}
function pendingIds(){return new Set((data?.inventory||[]).filter(x=>x.acquisitionState==='PENDING').map(x=>x.id).filter(Boolean))}
function duplicateBlocked(a){if(!a.relatedItemId)return false;const blocked=ownedIds().has(a.relatedItemId)||pendingIds().has(a.relatedItemId);if(!blocked)return false;const rationale=upper(`${a.why} ${a.next} ${a.triggerReason}`);return !(rationale.includes('UPGRADE')||rationale.includes('REPLACEMENT')||rationale.includes('RARER'))}
function admittedFinds(){const rank={BUY:0,CONSIDER:1,PASS:2},seen=new Set();return(data?.alerts||[]).filter(hasVerifiedLink).filter(a=>!duplicateBlocked(a)).filter(a=>{const k=a.listingId||canon(a.url)||canon(a.item);if(!k||seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>(rank[a.decision]??9)-(rank[b.decision]??9)).slice(0,3)}

function load(){try{data=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY)||'null')}catch(e){data=null}renderAll()}
function saveGood(d){data=d;localStorage.setItem(KEY,JSON.stringify(d));renderAll()}
function tokenRecord(){try{return JSON.parse(sessionStorage.getItem(TOKEN_KEY)||'null')}catch(e){return null}}
function validToken(){const t=tokenRecord();return t&&t.access_token&&Date.now()<t.expiresAt?t.access_token:null}
function saveToken(access_token,expires_in){sessionStorage.setItem(TOKEN_KEY,JSON.stringify({access_token,expiresAt:Date.now()+Number(expires_in||3600)*1000-60000}))}
function show(id,ctx=null){$$('.view').forEach(v=>v.classList.remove('active'));$('#'+id).classList.add('active');document.body.classList.toggle('home-mode',id==='homeView');currentView=id;if(ctx!==undefined&&ctx!==null)currentContext=ctx;window.scrollTo(0,0);renderCrumbs()}
function crumbHTML(parts){return parts.map((p,i)=>`${i?'<span class="slash">/</span>':''}${p.id?`<button data-jump="${p.id}">${esc(p.label)}</button>`:`<span class="here">${esc(p.label)}</span>`}`).join('')}
function renderCrumbs(){let parts=[];if(currentView==='findsView')parts=[{id:'homeView',label:'Home'},{label:"Today's Finds"}];if(currentView==='hitView')parts=[{id:'homeView',label:'Home'},{label:'Your Hit List'}];if(currentView==='targetMatchesView')parts=[{id:'homeView',label:'Home'},{id:'hitView',label:'Your Hit List'},{label:selectedTarget?.target||'Target'}];if(currentView==='collectionView')parts=[{id:'homeView',label:'Home'},{label:'Your Collection'}];if(currentView==='seriousView')parts=[{id:'homeView',label:'Home'},{id:'collectionView',label:'Your Collection'},{label:'Serious Collection'}];if(currentView==='categoryView')parts=[{id:'homeView',label:'Home'},{id:'collectionView',label:'Your Collection'},{id:'seriousView',label:'Serious Collection'},{label:selectedCategory||'Category'}];if(currentView==='itemView')parts=[{id:'homeView',label:'Home'},{id:'collectionView',label:'Your Collection'},{id:'seriousView',label:'Serious Collection'},{id:'categoryView',label:selectedCategory||'Category'},{label:selectedItem?.item||'Item'}];if(currentView==='askView')parts=currentContext?.trail?[...currentContext.trail,{label:'Ask Theo'}]:[{id:'homeView',label:'Home'},{label:'Ask Theo'}];$$('[data-crumb]').forEach(x=>x.innerHTML=crumbHTML(parts));$$('[data-jump]').forEach(b=>b.onclick=()=>show(b.dataset.jump))}
function svg(type){if(type==='paper')return`<svg viewBox="0 0 160 110" aria-hidden="true"><rect width="160" height="110" fill="#ded4c2"/><rect x="28" y="13" width="104" height="84" fill="#f4edde" stroke="#887c69"/><path d="M39 28h82M39 36h82M39 70h82M39 78h82" stroke="#9b907e"/><rect x="41" y="45" width="32" height="18" fill="#b4a893"/><path d="M81 46h38M81 53h38M81 60h30" stroke="#9b907e"/></svg>`;if(type==='map')return`<svg viewBox="0 0 160 110" aria-hidden="true"><rect width="160" height="110" fill="#d9d0bd"/><path d="M12 83C42 55 54 70 75 42s41-9 72-26M21 24c24 20 39 7 54 31s33 24 62 39" fill="none" stroke="#9a8b72" stroke-width="2"/><path d="M55 16l7 78M98 10l-6 89" stroke="#b5a78f"/><circle cx="77" cy="51" r="4" fill="#6e1f1b"/></svg>`;return`<svg viewBox="0 0 160 110" aria-hidden="true"><rect width="160" height="110" fill="#ddd3c1"/><rect x="29" y="25" width="23" height="66" fill="#77634a"/><rect x="55" y="17" width="28" height="74" fill="#9b815f"/><rect x="86" y="30" width="20" height="61" fill="#695744"/><rect x="109" y="22" width="24" height="69" fill="#b09a78"/><path d="M18 92h124" stroke="#7f735f" stroke-width="3"/></svg>`}
$('#artFinds').innerHTML=svg('paper');$('#artHit').innerHTML=svg('map');$('#artCollection').innerHTML=svg('books');
function renderFinds(){const l=admittedFinds();$('#findsList').innerHTML=l.length?l.map(a=>`<div class="find-card"><div class="thumb">${svg('paper')}</div><div><div class="find-title">${esc(a.item)}</div><div class="verdict ${esc(a.decision)}">${esc(a.decision)}</div><div class="why">${esc(a.why||a.next||'Worth your attention based on the current curator rules.')}</div><a class="listing" href="${esc(a.url)}" target="_blank" rel="noopener" data-live-listing="${esc(a.id)}">VIEW LISTING</a></div></div>`).join(''):`<div class="empty">Nothing worth showing right now.</div>`}
function renderHit(){const l=data?.targets||[];$('#hitList').innerHTML=l.length?l.map((t,i)=>`<button class="list-row" data-target-index="${i}"><div class="list-title">${esc(t.target)}</div>${t.criteria?`<div class="list-sub">${esc(t.criteria)}</div>`:''}</button>`).join(''):`<div class="empty">Nothing worth showing right now.</div>`;$$('[data-target-index]').forEach(b=>b.onclick=()=>{selectedTarget=l[Number(b.dataset.targetIndex)];currentContext={type:'target',label:selectedTarget.target,trail:[{id:'homeView',label:'Home'},{id:'hitView',label:'Your Hit List'},{label:selectedTarget.target}]};renderTargetMatches();show('targetMatchesView',currentContext)})}
function targetMatchesAlert(t,a){const tw=new Set(words(`${t.target} ${t.criteria}`)),aw=new Set(words(`${a.item} ${a.triggerReason} ${a.category}`));let overlap=0;tw.forEach(w=>{if(aw.has(w))overlap++});const cat=canon(t.category),catMatch=cat&&canon(a.category).includes(cat);return catMatch?overlap>=1:overlap>=2}
function renderTargetMatches(){if(!selectedTarget){$('#targetMatches').innerHTML='<div class="empty">Nothing worth showing right now.</div>';return}const hits=admittedFinds().filter(a=>targetMatchesAlert(selectedTarget,a));$('#targetMatches').innerHTML=hits.length?hits.map(a=>`<div class="find-card"><div class="thumb">${svg('paper')}</div><div><div class="find-title">${esc(a.item)}</div><div class="verdict ${esc(a.decision)}">${esc(a.decision)}</div><div class="why">${esc(a.why||a.next||'Current vetted match for this target.')}</div><a class="listing" href="${esc(a.url)}" target="_blank" rel="noopener" data-live-listing="${esc(a.id)}">VIEW LISTING</a></div></div>`).join(''):'<div class="empty">Nothing worth showing right now.</div>'}
const categories=['Books','Newspapers','Stamps & Postal History','Maps & Prints','Artifacts'];
function categoryFor(x){const c=upper(x.category);if(c.includes('BOOK'))return'Books';if(c.includes('NEWSPAPER'))return'Newspapers';if(c.includes('STAMP')||c.includes('POSTAL')||c.includes('FDC')||c.includes('COVER'))return'Stamps & Postal History';if(c.includes('MAP')||c.includes('PRINT'))return'Maps & Prints';return'Artifacts'}
function owned(){return(data?.inventory||[]).filter(x=>x.acquisitionState==='OWNED')}
function renderCategories(){$('#categoryList').innerHTML=categories.map(c=>`<button class="list-row" data-category="${esc(c)}"><div class="list-title">${esc(c)}</div></button>`).join('');$$('[data-category]').forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.category;renderItems();show('categoryView',{type:'category',label:selectedCategory,trail:[{id:'homeView',label:'Home'},{id:'collectionView',label:'Your Collection'},{id:'seriousView',label:'Serious Collection'},{label:selectedCategory}]})})}
function renderItems(){const l=owned().filter(x=>categoryFor(x)===selectedCategory);$('#itemList').innerHTML=l.length?l.map((x,i)=>`<button class="list-row" data-item-index="${i}"><div class="list-title">${esc(x.item)}</div>${x.creator?`<div class="list-sub">${esc(x.creator)}</div>`:''}</button>`).join(''):'<div class="empty">Nothing here yet.</div>';$$('[data-item-index]').forEach(b=>b.onclick=()=>{selectedItem=l[Number(b.dataset.itemIndex)];renderItem();show('itemView',{type:'item',label:selectedItem.item,trail:[{id:'homeView',label:'Home'},{id:'collectionView',label:'Your Collection'},{id:'seriousView',label:'Serious Collection'},{id:'categoryView',label:selectedCategory},{label:selectedItem.item}]})})}
function renderItem(){if(!selectedItem)return;const facts=[selectedItem.creator,selectedItem.detail,selectedItem.acquired,selectedItem.condition].filter(Boolean);$('#itemDetail').innerHTML=`<div class="item"><div class="item-photo">${svg('books')}</div><div><h1>${esc(selectedItem.item)}</h1>${facts.map(x=>`<p>${esc(x)}</p>`).join('')}</div></div>`}
function renderAsk(){$('#askContext').textContent=currentContext?.label||''}
function contextPayload(){if(currentContext?.type==='item'&&selectedItem)return{type:'owned item',item:selectedItem.item,creator:selectedItem.creator,detail:selectedItem.detail,acquired:selectedItem.acquired,condition:selectedItem.condition};if(currentContext?.type==='target'&&selectedTarget)return{type:'hit list target',target:selectedTarget.target,criteria:selectedTarget.criteria,category:selectedTarget.category};return currentContext?.label?{type:currentContext.type||'context',label:currentContext.label}:null}
function renderAll(){renderFinds();renderHit();renderCategories();if(selectedCategory)renderItems();if(selectedItem)renderItem();renderAsk();$('#syncPill').textContent=data?'SYNC':'SYNC'}
function mustHave(rows,fields,label){if(!rows.length)throw new Error(`${label}: no rows returned`);const keys=new Set(Object.keys(rows[0]||{}));const missing=fields.filter(f=>!keys.has(f));if(missing.length)throw new Error(`${label}: missing ${missing.join(', ')}`)}
async function batchGet(token){const p=new URLSearchParams();RANGES.forEach(r=>p.append('ranges',r));p.set('majorDimension','ROWS');p.set('valueRenderOption','FORMATTED_VALUE');const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchGet?${p}`,{headers:{Authorization:`Bearer ${token}`}});if(res.status===401)throw new Error('Google authorization expired.');if(!res.ok){let msg='';try{msg=(await res.json())?.error?.message||''}catch(e){}throw new Error(msg||`Sheets API ${res.status}`)}return res.json()}
function buildModel(payload){const sets=payload.valueRanges||[];const tabs=sets.map(x=>rowsToObjects(x.values||[]));const[inv,ord,tgt,alt,dec,mem,eng,run,sight]=tabs;mustHave(inv,['Category','Item','Status','Item ID'],'Inventory');mustHave(tgt,['Target ID','Active?','Target'],'Target Register');mustHave(alt,['Alert ID','Item','Listing URL','Operational Status','Curatorial Decision'],'Alert Register');const inventory=inv.map(r=>{const status=norm(r['Status']);return{id:norm(r['Item ID']),category:norm(r['Category']),item:norm(r['Item']),status,acquisitionState:acquisitionState(status),creator:norm(r['Author / Creator']||r['Author']||r['Creator']),detail:norm(r['Edition / Distinguishing Characteristic']||r['Edition']||r['Notes']),acquired:norm(r['Acquisition Date']||r['Acquired']||r['Purchased']),condition:norm(r['Condition'])}}).filter(x=>x.id&&x.item);const targets=tgt.filter(r=>upper(r['Active?'])==='YES').map(r=>({id:norm(r['Target ID']),target:norm(r['Target']),criteria:norm(r['Desired Attributes']),category:norm(r['Category'])})).filter(x=>x.id&&x.target);const alerts=alt.filter(r=>activeOperational(r['Operational Status'])).map(r=>{let d=upper(r['Curatorial Decision']);if(d==='VERIFY'||d==='WATCH'||d==='BUY IF VERIFIED')d=d==='BUY IF VERIFIED'?'BUY':'CONSIDER';return{id:norm(r['Alert ID']),decision:['BUY','CONSIDER','PASS'].includes(d)?d:'CONSIDER',item:norm(r['Item']),category:norm(r['Category']),source:norm(r['Source']),url:norm(r['Listing URL']),listingId:norm(r['Listing ID']),operationalStatus:norm(r['Operational Status']),linkVerification:norm(r['Link Verification']),triggerReason:norm(r['Trigger Reason']),relatedItemId:norm(r['Related Item ID']),next:norm(r['Next Action']),why:norm(r['Why']||r['Rationale']||r['Curator Rationale'])}}).filter(x=>x.id&&x.item);return{meta:{version:'0.7',syncSource:'GOOGLE_SHEETS',lastSuccessfulSync:new Date().toISOString()},inventory,orders:ord,targets,alerts,decisions:dec,historicalMemory:mem,decisionEngine:eng,theoRuntime:run,sightings:sight}}
async function syncWithToken(token){if(syncing)return;syncing=true;$('#syncPill').textContent='…';try{saveGood(buildModel(await batchGet(token)));$('#syncPill').textContent='LIVE'}catch(e){$('#syncPill').textContent='ERROR';$('#syncPill').classList.add('error');alert(`THEO sync failed. Last known-good data was kept.\n\n${e.message}`)}finally{syncing=false}}
function initGoogle(){if(!window.google?.accounts?.oauth2){setTimeout(initGoogle,250);return}tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:r=>{if(r.error)return;saveToken(r.access_token,r.expires_in);syncWithToken(r.access_token)}});const t=validToken();if(t)syncWithToken(t)}
function requestSync(){const t=validToken();if(t)return syncWithToken(t);if(!tokenClient)return alert('Google authorization is still loading.');tokenClient.requestAccessToken({prompt:''})}
$$('[data-go]').forEach(b=>b.onclick=()=>{const id=b.dataset.go;let ctx=null;if(id==='findsView')ctx={type:'finds',label:"Today's Finds",trail:[{id:'homeView',label:'Home'},{label:"Today's Finds"}]};if(id==='hitView')ctx={type:'hit',label:'Your Hit List',trail:[{id:'homeView',label:'Home'},{label:'Your Hit List'}]};if(id==='collectionView')ctx={type:'collection',label:'Your Collection',trail:[{id:'homeView',label:'Home'},{label:'Your Collection'}]};show(id,ctx)});
$$('[data-lane]').forEach(b=>b.onclick=()=>alert('Nothing here yet.'));
$('#syncPill').onclick=requestSync;
$('#askInput').onfocus=()=>{if(currentView!=='askView'){if(!currentContext)currentContext={type:'general',label:'',trail:[{id:'homeView',label:'Home'}]};show('askView',currentContext);renderAsk()}};
function askTheo(extra=''){const text=norm($('#askInput').value);if(!text&&!extra)return;const ctx=contextPayload();const context=ctx?`Active THEO context: ${JSON.stringify(ctx)}. `:'';const prompt=`You are THEO, my Civil War collecting curator. Use the active context without asking me to restate it. ${context}${extra}${text}`;window.open(`https://chatgpt.com/?q=${encodeURIComponent(prompt)}`,'_blank');$('#askInput').value=''}
$('#sendBtn').onclick=()=>askTheo();$('#askInput').onkeydown=e=>{if(e.key==='Enter')askTheo()};
$('#photoBtn').onclick=()=>$('#photoInput').click();$('#photoInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;currentContext=currentContext||{type:'general',label:'',trail:[{id:'homeView',label:'Home'}]};show('askView',currentContext);$('#askInput').value='Assess this Civil War collecting sighting.';alert('Photo selected. Use the ChatGPT attachment control after THEO opens; browsers cannot transfer the image file into ChatGPT automatically.');};
load();window.addEventListener('load',initGoogle);renderCrumbs();
</script>
</body>
</html>
